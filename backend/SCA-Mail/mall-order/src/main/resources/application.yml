server:
  port: 8105

spring:
  application:
    name: mall-order
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:192.168.198.133}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: 1s
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/mall_order?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

mall:
  # 下单幂等标记（19.9 / 27.7）：PENDING 占位 60s，成功回填 orderNo 后按业务窗口保存
  idem:
    ttl-hours: ${ORDER_IDEM_TTL_HOURS:24}
    pending-ttl-seconds: ${ORDER_IDEM_PENDING_TTL_SECONDS:60}
  auth:
    # 与网关、mall-auth 保持一致；未配置时服务端不采信任何身份头（fail-closed，见 21.2）
    internal-token: ${INTERNAL_TOKEN:}
  order:
    # 待支付超时时间（分钟），超时由 OrderTimeoutTask 兜底取消
    pay-timeout-minutes: ${ORDER_PAY_TIMEOUT_MINUTES:30}
    timeout-scan:
      enabled: ${ORDER_TIMEOUT_SCAN_ENABLED:true}
      interval-ms: ${ORDER_TIMEOUT_SCAN_INTERVAL_MS:60000}
      initial-delay-ms: ${ORDER_TIMEOUT_SCAN_INITIAL_DELAY_MS:30000}
  # RocketMQ（第三阶段第 7 项，见需求文档 19.6 / 20.3）
  mq:
    enabled: ${MALL_MQ_ENABLED:true}
    name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
    # 本地消息表补发任务：候选扫描周期与退避（20.3）
    outbox:
      enabled: ${MALL_MQ_OUTBOX_ENABLED:true}
      interval-ms: ${MALL_MQ_OUTBOX_INTERVAL_MS:30000}
      initial-delay-ms: ${MALL_MQ_OUTBOX_INITIAL_DELAY_MS:15000}
      batch-size: ${MALL_MQ_OUTBOX_BATCH_SIZE:200}
      max-retry: ${MALL_MQ_OUTBOX_MAX_RETRY:3}
    consumer:
      # 订单侧消费 TOPIC_PAY_SUCCESS（OrderMqConfig 已注册订阅）：
      # 支付侧同步回调失败时由该事件兜底把订单推进到已支付（29.5）
      enabled: ${MALL_MQ_CONSUMER_ENABLED:true}
      max-reconsume-times: ${MALL_MQ_MAX_RECONSUME:3}


logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
