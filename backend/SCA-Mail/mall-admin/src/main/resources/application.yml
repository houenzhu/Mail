server:
  port: 8111

spring:
  application:
    name: mall-admin
  servlet:
    multipart:
      # 单文件/单请求上限略高于业务上限（5 MB），让业务层返回可读错误而不是容器直接拒绝
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:6MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:8MB}
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 5000
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml

# 说明：mall-admin 是纯聚合 BFF，**没有自己的数据库**（见计划文档 ADR-N1）：
# 它不发令牌也不存业务数据，只把网关注入的身份头继续透传给下游服务。

mybatis:
  # 本服务不连库；此处仅为避免其他服务的配置经 Nacos 误导入时找不到 mapper 而报错
  mapper-locations: classpath*:mapper/*.xml

mall:
  auth:
    # 与网关、各业务服务保持一致；下游服务只信任携带该令牌的请求
    internal-token: ${INTERNAL_TOKEN:}

  oss:
    # 商品图上传：密钥只从进程环境读取，不写入仓库
    enabled: ${OSS_ENABLED:true}
    endpoint: ${OSS_ENDPOINT:oss-cn-guangzhou.aliyuncs.com}
    bucket: ${OSS_BUCKET:zheliving-10000}
    public-base-url: ${OSS_PUBLIC_BASE_URL:}
    # 商品图本身就需要被 C 端直接展示；桶应设为公共读，返回稳定 URL 而不是会过期的签名 URL
    public-read: ${OSS_PUBLIC_READ:true}
    url-expire-seconds: ${OSS_URL_EXPIRE_SECONDS:86400}
    max-file-size: ${OSS_MAX_FILE_SIZE:5242880}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
